
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Adventure</title>
<style>
*{box-sizing:border-box}
:root{--ui:#18202b;--edge:#394553;--gold:#f6d65b}
body{margin:0;background:#10151d;color:#fff;font:12px Arial;overflow:hidden}
button{color:white;background:#25313f;border:1px solid #455364;padding:8px;cursor:pointer}
button:hover,button.on{background:#456b48}
#world{position:fixed;inset:0 0 150px;overflow:hidden;background:#63b89a}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}
.top>*{pointer-events:auto}
.box{background:#101821eF;border:1px solid #43515d;box-shadow:0 3px 0 #10151a;border-radius:5px;padding:8px}
.logo{color:var(--gold);font-weight:900;letter-spacing:1px}
#auto{position:absolute;top:0;left:50%;transform:translateX(-50%);width:170px;text-align:center;border-radius:0 0 20px 20px;font-weight:bold;padding:12px}
#right{display:grid;gap:6px;width:164px}
#right .box{text-align:center;font-weight:bold}
.icons{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.icons button{height:42px;font-size:19px;background:#15222ceF}
#toast{position:fixed;top:85px;left:8px;max-width:270px}
#chat{position:fixed;left:12px;bottom:162px;background:#101821dd;padding:12px;width:290px;border:1px solid #44515e;border-radius:5px}
#level{position:fixed;bottom:157px;left:50%;transform:translateX(-50%);width:230px;text-align:center;background:#111923eF;border-radius:20px;padding:5px}
.track{height:6px;background:#080d12;border-radius:8px;overflow:hidden}
.track span{height:100%;display:block;background:#e7c84d}
#bottom{position:fixed;bottom:0;left:0;right:0;height:150px;background:#202a38;border-top:5px solid #596575;display:grid;grid-template-columns:180px 120px 1fr 270px 175px;gap:5px;padding:7px;align-items:stretch}
.slot{background:#121a25;border:1px solid #45505f;display:flex;align-items:center;justify-content:center;position:relative}
#mini{width:100%;height:100%;image-rendering:pixelated}
#inventory{display:grid;place-items:center;text-align:center;font-size:13px;cursor:pointer}
#tools{display:grid;grid-template-columns:repeat(8,minmax(30px,1fr));grid-template-rows:1fr 1fr;gap:4px}
.tool{font-size:19px;padding:3px;min-width:0}
#mon,#mon2{display:flex;align-items:center;justify-content:space-around;gap:7px;font-size:11px}
.monpic{font-size:32px}
#moninfo{flex:1;min-width:0}
#monname{font-size:12px;font-weight:bold;overflow-wrap:anywhere}
#mobile{display:none;position:fixed;left:12px;bottom:165px;gap:4px}
#mobile button{width:42px;height:42px;font-size:19px}
#modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;place-items:center}
#modal.open{display:grid}
#modalinner{background:#1c2836;border:1px solid #677587;padding:22px;border-radius:8px;max-width:420px;width:90%}
@media(max-width:850px){
 #world{bottom:116px}
 #bottom{height:116px;grid-template-columns:95px 60px 1fr}
 #mon,#mon2{display:none}
 #tools{grid-template-columns:repeat(4,minmax(24px,1fr));grid-template-rows:repeat(4,1fr)}
 .tool{font-size:15px;padding:0}
 #chat{bottom:124px;width:190px}
 #level{bottom:120px}
 #right{width:125px}
 #right .box{padding:5px}
 #mobile{display:grid;grid-template-columns:repeat(3,42px)}
 #mobile button:nth-child(1){grid-column:2}
 #mobile button:nth-child(2){grid-column:1;grid-row:2}
 #mobile button:nth-child(3){grid-column:2;grid-row:2}
 #mobile button:nth-child(4){grid-column:3;grid-row:2}
}
</style>
</head>
<body>
<div id="world"><canvas id="map"></canvas></div>

<div class="top">
 <div class="box">
  <div class="logo">✦ ADVENTURE</div>
  <div style="margin-top:8px">☀ Dia <span id="clock">09:57</span></div>
  <div style="margin-top:6px">🟢 <span id="fps">ONLINE</span></div>
 </div>
 <button id="auto" onclick="toggleAuto()">AUTO <span id="autotext">OFF</span></button>
 <div id="right">
  <div class="box">🪙 <span id="coins">120</span>　◉ <span id="balls">5</span></div>
  <div class="box" style="color:var(--gold)">🏆 PASSE DE BATALHA</div>
  <div class="box">🌟 Exploração <span id="percent">0</span>%</div>
  <div class="icons">
   <button onclick="message('Painel de personagem')">🧍</button>
   <button onclick="openPanel('Inventário','Suas moedas: '+coins+' | Pokébolas: '+balls)">🎒</button>
   <button onclick="openPanel('Missões','Explore o mapa e encontre Pokémon selvagens.')">⚑</button>
   <button onclick="openPanel('Social','Modo individual de demonstração.')">☏</button>
   <button onclick="openPanel('Pokémon','Use os controles da equipe na barra inferior.')">👾</button>
   <button onclick="openPanel('Mapa','Caminhe pelo mapa usando WASD ou as setas.')">▦</button>
   <button onclick="openPanel('Notificações',lastMessage)">❗</button>
   <button onclick="openPanel('Ajuda','WASD / setas para andar. E para explorar.')">?</button>
  </div>
  <button onclick="explore()">🌿 EXPLORAR</button>
 </div>
</div>

<div id="toast" class="box">🌿 Bem-vindo! Explore o mapa.</div>
<div id="chat">💬 <b>Chat</b><br><span id="chatmsg" style="color:#b8c6d3">Sua aventura começa aqui.</span></div>
<div id="level">NÍVEL <b id="lvl">5</b>　<div class="track"><span id="xpbar" style="width:8%"></span></div></div>

<div id="mobile">
 <button onclick="move(0,-1)">▲</button>
 <button onclick="move(-1,0)">◀</button>
 <button onclick="move(0,1)">▼</button>
 <button onclick="move(1,0)">▶</button>
</div>

<div id="bottom">
 <div class="slot"><canvas id="mini"></canvas></div>
 <div class="slot" id="inventory" onclick="openPanel('Inventário','🪙 '+coins+' moedas | 🔴 '+balls+' Pokébolas')">🎒<br>Inventário</div>
 <div id="tools">
  <button class="tool" title="Pokébolas" onclick="openPanel('Pokébolas','Você possui '+balls+' Pokébolas.')">🔗</button>
  <button class="tool" title="Itens" onclick="openPanel('Itens','Itens encontrados durante a exploração.')">🧰</button>
  <button class="tool" title="Missões" onclick="openPanel('Missões','Explore e encontre Pokémon.')">📜</button>
  <button class="tool" title="Pokédex" onclick="openPanel('Pokédex',seen.size+' espécies descobertas.')">📕</button>
  <button class="tool" title="Equipe" onclick="openPanel('Equipe','Charmander Nv. 5')">👹</button>
  <button class="tool" title="Configurações" onclick="openPanel('Configurações','Controles: WASD ou setas.')">⚙️</button>
  <button class="tool" title="Pokémon" onclick="openPanel('Pokémon','Charmander é seu parceiro atual.')">🐉</button>
  <button class="tool" title="Ajuda" onclick="openPanel('Ajuda','Explore a grama para encontrar Pokémon.')">❔</button>
  <button class="tool" onclick="explore()">🌿</button>
  <button class="tool" onclick="openPanel('Loja','Moedas: '+coins)">🛒</button>
  <button class="tool" onclick="openPanel('Calendário','A aventura está em andamento.')">📅</button>
  <button class="tool" onclick="openPanel('Conquistas','Continue explorando para progredir.')">🏆</button>
  <button class="tool" onclick="openPanel('Social','Multiplayer não está conectado nesta versão.')">🤝</button>
  <button class="tool" onclick="openPanel('Coleção','Pokémon descobertos: '+seen.size)">🧭</button>
  <button class="tool" onclick="toggleAuto()">⟳</button>
  <button class="tool" onclick="save()">💾</button>
 </div>
 <div class="slot" id="mon">
  <div class="monpic">🔥</div><div id="moninfo">
   <div style="color:#9caaba">Nv. <span id="mlvl">5</span></div>
   <div id="monname">Charmander</div>
   <div>HP <span id="hptext">21/21</span></div>
   <div class="track"><span id="hpbar" style="width:100%;background:#71d56c"></span></div>
   <div>XP <span id="mxp">4</span></div>
   <div class="track"><span id="monxp" style="width:12%;background:#49a9f5"></span></div>
  </div>
 </div>
 <div class="slot" id="mon2"><button onclick="message('Próximo Pokémon')">‹</button><div><div class="monpic">🟣</div><b>Eevee</b><br>Nv. 6</div><button onclick="message('Próximo Pokémon')">›</button></div>
</div>

<div id="modal"><div id="modalinner"><h2 id="mtitle">Menu</h2><p id="mbody"></p><button onclick="closePanel()">Fechar</button></div></div>

<script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const mini=document.getElementById('mini'),mc=mini.getContext('2d');
let W=0,H=0,tile=32,camX=0,camY=0;
let px=0,py=0,coins=120,balls=5,xp=4,lvl=5,steps=0,auto=false;
let seen=new Set(),lastMessage='Sua aventura começa aqui.',lastMove=Date.now();
const worldW=100,worldH=100;
let seed=12489;
function rand(x,y){let n=Math.sin(x*127.1+y*311.7+seed)*43758.5453;return n-Math.floor(n)}
function resize(){
 let d=devicePixelRatio||1,r=canvas.getBoundingClientRect();
 canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);
 ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;
 mini.width=mini.clientWidth*d;mini.height=mini.clientHeight*d;
 draw();
}
function tree(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='#3c6e43';ctx.fillRect(-9,-1,18,12);
 ctx.fillStyle='#654d37';ctx.fillRect(-4,-5,8,15);
 ctx.fillStyle='#267648';ctx.fillRect(-13,-15,26,20);
 ctx.fillStyle='#318b4b';ctx.fillRect(-11,-23,22,15);
 ctx.fillStyle='#70c96e';ctx.fillRect(-8,-25,15,8);
 ctx.fillStyle='#a1e982';ctx.fillRect(-5,-23,7,5);
 ctx.fillStyle='#226b42';ctx.fillRect(-14,-13,5,13);
 ctx.fillStyle='#449d50';ctx.fillRect(8,-17,5,10);
 ctx.restore();
}
function grass(x,y){
 ctx.fillStyle='#287b55';ctx.fillRect(x-10,y-5,20,10);
 ctx.fillStyle='#a5e57c';ctx.fillRect(x-7,y-9,3,10);
 ctx.fillRect(x,y-12,3,13);ctx.fillRect(x+6,y-7,3,8);
 ctx.fillStyle='#397c46';ctx.fillRect(x-11,y+4,22,2);
}
function character(x,y){
 ctx.fillStyle='#276749';ctx.fillRect(x-9,y+9,18,5);
 ctx.fillStyle='#f2bc8b';ctx.fillRect(x-6,y-10,12,13);
 ctx.fillStyle='#332a35';ctx.fillRect(x-7,y-12,14,6);
 ctx.fillStyle='#1d60bd';ctx.fillRect(x-11,y-17,22,8);
 ctx.fillStyle='#388cf0';ctx.fillRect(x-7,y-23,14,8);
 ctx.fillStyle='#183f85';ctx.fillRect(x-10,y-19,20,4);
 ctx.fillStyle='#f2bc8b';ctx.fillRect(x-5,y-6,2,2);
 ctx.fillStyle='#282d39';ctx.fillRect(x-5,y+2,4,7);ctx.fillRect(x+2,y+2,4,7);
 ctx.fillStyle='#f5d44f';ctx.fillRect(x-10,y+9,7,3);ctx.fillRect(x+3,y+9,7,3);
}
function draw(){
 if(!W||!H)return;
 let cols=Math.ceil(W/tile)+2,rows=Math.ceil(H/tile)+2;
 let ox=Math.floor(camX/tile),oy=Math.floor(camY/tile);
 let fx=camX%tile,fy=camY%tile;
 ctx.clearRect(0,0,W,H);
 for(let j=-1;j<rows;j++)for(let i=-1;i<cols;i++){
  let wx=ox+i,wy=oy+j,x=i*tile-fx,y=j*tile-fy;
  let n=rand(wx,wy);
  ctx.fillStyle=n>.5?'#69bd91':'#64b78a';
  ctx.fillRect(x,y,tile,tile);
  ctx.fillStyle='#8bcca0';
  for(let k=0;k<3;k++){
   let gx=x+rand(wx+k,wy)*tile,gy=y+rand(wx,wy+k)*tile;
   ctx.fillRect(gx,gy,2,2);
  }
  if(n>.84&&Math.abs(wx-px)>2&&Math.abs(wy-py)>2)tree(x+tile/2,y+tile*.65,.85+rand(wx,wy)*.3);
  else if(n>.72)grass(x+tile/2,y+tile*.65);
 }
 let sx=W/2,sy=H/2;
 character(sx,sy);
 ctx.font='bold 11px Arial';ctx.textAlign='center';
 ctx.fillStyle='#fff';ctx.strokeStyle='#22362c';ctx.lineWidth=3;
 ctx.strokeText('Treinador',sx,sy-31);ctx.fillText('Treinador',sx,sy-31);
 drawMini();
}
function drawMini(){
 let w=mini.clientWidth,h=mini.clientHeight;if(!w||!h)return;
 mc.setTransform(mini.width/w,0,0,mini.height/h,0,0);
 for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4){
  mc.fillStyle=rand(x+Math.floor(camX/32),y+Math.floor(camY/32))>.78?'#34774b':'#64b68b';
  mc.fillRect(x,y,4,4);
 }
 mc.fillStyle='#f6d65b';mc.fillRect(w/2-3,h/2-3,6,6);
}
function move(dx,dy){
 px+=dx;py+=dy;steps++;lastMove=Date.now();
 camX=Math.max(0,px*tile-W/2);camY=Math.max(0,py*tile-H/2);
 document.getElementById('percent').textContent=Math.min(100,Math.floor(steps/3));
 draw();
 if(Math.random()<.16)message('Você encontrou vegetação alta. Pressione E para explorar!');
}
function explore(){
 seen.add('Charmander');coins+=Math.random()<.5?5:0;
 if(Math.random()<.5)balls++;
 xp+=3;
 if(xp>=100){lvl++;xp=0}
 document.getElementById('coins').textContent=coins;
 document.getElementById('balls').textContent=balls;
 document.getElementById('lvl').textContent=lvl;
 document.getElementById('xpbar').style.width=xp+'%';
 document.getElementById('mlvl').textContent=lvl;
 document.getElementById('mxp').textContent=xp;
 document.getElementById('monxp').style.width=xp+'%';
 message(Math.random()<.5?'Você explorou a grama alta!':'Você encontrou itens na região!');
}
function toggleAuto(){
 auto=!auto;document.getElementById('autotext').textContent=auto?'ON':'OFF';
 document.getElementById('auto').classList.toggle('on',auto);
 message(auto?'Exploração automática ativada.':'Exploração automática desativada.');
}
function message(s){
 lastMessage=s;document.getElementById('toast').textContent='🌿 '+s;
 document.getElementById('chatmsg').textContent=s;
}
function openPanel(title,body){
 document.getElementById('mtitle').textContent=title;
 document.getElementById('mbody').textContent=body;
 document.getElementById('modal').classList.add('open');
}
function closePanel(){document.getElementById('modal').classList.remove('open')}
function save(){
 try{localStorage.setItem('adventureSave',JSON.stringify({coins,balls,xp,lvl,steps,px,py,seen:[...seen]}));message('Progresso salvo!')}
 catch(e){message('Não foi possível salvar.')}
}
function load(){
 try{
  let s=JSON.parse(localStorage.getItem('adventureSave')||'null');
  if(s){coins=s.coins;balls=s.balls;xp=s.xp;lvl=s.lvl;steps=s.steps;px=s.px;py=s.py;seen=new Set(s.seen||[])}
 }catch(e){}
 camX=Math.max(0,px*tile-W/2);camY=Math.max(0,py*tile-H/2);
}
window.addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowUp'||e.key==='w')move(0,-1);
 if(e.key==='ArrowDown'||e.key==='s')move(0,1);
 if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);
 if(e.key==='ArrowRight'||e.key==='d')move(1,0);
 if(e.key==='e'||e.key==='E')explore();
 if(e.key==='Escape')closePanel();
});
window.addEventListener('resize',resize);
setInterval(()=>{let d=new Date();document.getElementById('clock').textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')},1000);
setInterval(()=>{if(auto){if(Date.now()-lastMove>7000)move(Math.floor(Math.random()*3)-1,Math.floor(Math.random()*3)-1);explore()}},8000);
load();resize();
</script>
</body>
</html>
